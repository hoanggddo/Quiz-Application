spring.application.name=quiz-application-api

# Spring Boot forces java.awt.headless=true by default, assuming it's
# running as a server with no display. That silently blocks any Swing/AWT
# window from ever appearing (java.awt.HeadlessException). This app
# needs a real display for the DesktopApp UI, so headless mode is
# disabled explicitly.
spring.main.headless=false

# H2 file-based database -- persists to ./data/quizdb.mv.db between runs.
# To move to PostgreSQL or MySQL in production, swap this block and the
# driver dependency in pom.xml; no entity or repository code changes needed.
spring.datasource.url=jdbc:h2:file:./data/quizdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2's built-in web console, handy for inspecting data during development.
# Disable this (or remove it entirely) before any real deployment.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
