spring.application.name=quiz-application-api

# Cloud hosts (Render, Railway, etc.) assign a port dynamically via the
# PORT environment variable. Falls back to 8080 for local runs where
# PORT isn't set.
server.port=${PORT:8080}

# Spring Boot forces java.awt.headless=true by default, assuming it's
# running as a server with no display. That silently blocks any Swing/AWT
# window from ever appearing (java.awt.HeadlessException). This app
# needs a real display for the DesktopApp UI, so headless mode is
# disabled explicitly.
spring.main.headless=false

# --- Database ---
# Defaults below are for LOCAL/SOLO use: a file-based H2 database, no
# setup required. For a shared deployment where multiple users connect
# to one real server, override these four properties with environment
# variables on the hosting platform instead of editing this file:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:<port>/<database>
#   SPRING_DATASOURCE_USERNAME=<your postgres username>
#   SPRING_DATASOURCE_PASSWORD=<your postgres password>
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
# Spring Boot automatically prefers environment variables over this file,
# so no code changes are needed to switch databases.
spring.datasource.url=jdbc:h2:file:./data/quizdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2's built-in web console. Only meaningful when actually using H2;
# harmless to leave enabled when deployed with Postgres, but you can set
# SPRING_H2_CONSOLE_ENABLED=false as an env var on a shared server anyway.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
